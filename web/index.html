  <!-- =====================================================
       SUPABASE PASSWORD RECOVERY URL WATCHER
       ===================================================== -->

  <script>

    (function () {

      console.log(
        "🌐 MediMate web page started"
      );

      function checkForRecoveryCode() {

        try {

          const currentUrl =
            window.location.href;

          const params =
            new URLSearchParams(
              window.location.search
            );

          const code =
            params.get("code");

          if (
            code &&
            code.length > 0
          ) {

            const existingCode =
              sessionStorage.getItem(
                "supabase_recovery_code"
              );

            // Save only when it is a new code.

            if (
              existingCode !== code
            ) {

              console.log(
                "🔑 PASSWORD RECOVERY CODE FOUND IN BROWSER:",
                code
              );

              sessionStorage.setItem(
                "supabase_recovery_code",
                code
              );

              sessionStorage.setItem(
                "supabase_recovery_url",
                currentUrl
              );

              console.log(
                "✅ Recovery code saved to sessionStorage"
              );
            }
          }

        } catch (error) {

          console.error(
            "❌ Recovery URL check failed:",
            error
          );

        }
      }

      // Check immediately when the page loads.

      checkForRecoveryCode();

      // Keep checking in case the browser URL changes
      // while Flutter is already running.

      setInterval(
        checkForRecoveryCode,
        300
      );

    })();

  </script>
