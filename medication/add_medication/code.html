<div class="relative flex h-auto min-h-screen w-full flex-col justify-between overflow-x-hidden">

</div>
<div class="space-y-2">

<option>12:00 PM</option>
<option>6:00 PM</option>
</select>
</div>
<button class="w-full bg-primary text-white font-bold py-4 px-4 rounded-lg shadow-md hover:bg-primary/90 transition-colors">Save Medication</button>
