name: medi_mate
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.7.0-0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  barcode_widget: ^2.0.4
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.3
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  lottie: ^3.1.3
  web: ^1.1.1
  flutter_svg: ^2.0.16
  supabase_flutter: 2.17.2
  wave: ^0.2.2
  permission_handler: ^11.3.1
  confetti: ^0.7.0
  intl: ^0.19.0
  logger: ^2.5.0
  mobile_scanner: ^7.4.2
  firebase_messaging: ^15.2.10
  firebase_core: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
    - assets/icons/
    - assets/images/home_doctor.png
    - assets/images/hydration_bottle.png
    - assets/images/stock_medicine.png
    - assets/images/notification_bell.png